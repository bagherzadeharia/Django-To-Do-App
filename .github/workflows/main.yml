on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  Test:
    name: Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Create test environment
      run: |
        cat > .env <<'EOF'
        SECRET_KEY=${{ secrets.SECRET_KEY }}
        DEBUG=${{ secrets.DEBUG }}
        ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
        EMAIL_USE_TLS=${{ secrets.EMAIL_USE_TLS }}
        EMAIL_HOST=${{ secrets.EMAIL_HOST }}
        EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}
        EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}
        EMAIL_PORT=${{ secrets.EMAIL_PORT }}
        CELERY_BROKER_URL=${{ secrets.CELERY_BROKER_URL }}
        OPENWEATHER_API_KEY=${{ secrets.OPENWEATHER_API_KEY }}
        EOF

    - name: Setup docker-compose
      run: docker compose up -d --build to-do-app-backend redis-to-do-app

    # - name: Flake8
    #   run: docker compose exec to-do-app-backend sh -c "flake8"

    - name: Tests
      run: docker compose exec to-do-app-backend sh -c "pytest ."

    - name: Debug
      if: always()
      run: |
        docker compose ps -a
        docker inspect $(docker compose ps -aq to-do-app-backend) --format 'OOM={{.State.OOMKilled}} exit={{.State.ExitCode}} restarts={{.RestartCount}}'
        docker compose logs --tail=80 to-do-app-backend
        free -m

  darkube_build_to-do-app_ab82dept_hamravesh-c11:
    container:
      image: hamravesh/darkube-cli:v1.1
      options: --user root
    env:
      IMAGE_NAME: registry.hamdocker.ir/ab82dept/to-do-app
    runs-on: ubuntu-latest
    needs: Test
    steps:
    - name: checkout commit
      uses: actions/checkout@v4
    - name: darkube-cli build & push
      run: 'darkube build --push -t $IMAGE_NAME:${GITHUB_SHA:0:7} -t $IMAGE_NAME:${GITHUB_REF_NAME}
        --docker-auth-config ''${{secrets.DOCKER_AUTH_CONFIG}}'' --workdir . --file
        ./Dockerfile --build-context . '
  darkube_deploy_to-do-app_ab82dept_hamravesh-c11:
    container: hamravesh/darkube-cli:v1.1
    needs: darkube_build_to-do-app_ab82dept_hamravesh-c11
    runs-on: ubuntu-latest
    steps:
    - name: darkube-cli deploy
      run: darkube deploy --token ${{secrets.DEPLOY_TOKEN_TO_DO_APP_AB82DEPT_HAMRAVESH_C11}}
        --app-id ${{secrets.APP_ID_TO_DO_APP_AB82DEPT_HAMRAVESH_C11}} --image-tag
        ${GITHUB_SHA:0:7} --job-id ${GITHUB_RUN_ID}
