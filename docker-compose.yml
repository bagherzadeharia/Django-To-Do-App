# version: "29.5"

services:
  to-do-app-backend:
    build: .
    container_name: to-do-app-backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./core:/app
      - ./entrypoint.py:/entrypoint.py
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis-to-do-app

  smtp4dev:
    image: rnwood/smtp4dev:v3
    restart: always
    ports:
      - '5000:80'
      - '25:25'
      - '143:143'
      - '110:110'
    volumes:
        - smtp4dev-data:/smtp4dev
    environment:
      - ServerOptions__Urls=http://*:80
      - ServerOptions__HostName=smtp4dev

  master:
      image: locustio/locust
      profiles: ["loadtest"]
      ports:
       - "8089:8089"
      volumes:
        - ./core/locust:/mnt/locust
      command: -f /mnt/locust/locustfile.py --master -H http://to-do-app-backend:8089

  locust-worker:
    image: locustio/locust
    profiles: ["loadtest"]
    volumes:
      - ./core/locust:/mnt/locust
    command: -f /mnt/locust/locustfile.py --worker --master-host master

  redis-to-do-app:
    container_name: redis-to-do-app
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning

  worker:
    build: .
    command: celery -A core worker --loglevel=info
    volumes:
      - ./core:/app
      - ./entrypoint.py:/entrypoint.py
    env_file:
      - .env
    depends_on:
      - redis-to-do-app
      - to-do-app-backend

  beater:
    build: .
    command: celery -A core beat --loglevel=info  --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./core:/app
      - ./entrypoint.py:/entrypoint.py
    env_file:
      - .env
    depends_on:
      - redis-to-do-app
      - to-do-app-backend

volumes:
  smtp4dev-data:
