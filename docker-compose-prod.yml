# version: "29.5"

services:
  to-do-app-backend:
    build: .
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn core.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - static-volume:/app/staticfiles
      - media-volume:/app/media
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis-to-do-app:
        condition: service_healthy

  redis-to-do-app:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx-to-do-app:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - static-volume:/home/app/staticfiles:ro
      - media-volume:/home/app/media:ro
    ports:
      - "80:80"
    depends_on:
      - to-do-app-backend

  worker:
    build: .
    restart: unless-stopped
    command: celery -A core worker --loglevel=info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis-to-do-app:
        condition: service_healthy

  beater:
    build: .
    restart: unless-stopped
    command: celery -A core beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis-to-do-app:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  static-volume:
  media-volume:
  postgres-data:
  redis-data:
