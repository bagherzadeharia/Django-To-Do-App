# version: "29.5"

services:
  to-do-app-backend:
    build: .
    container_name: to-do-app-backend
    command:
      - /bin/sh
      - -c
      - python manage.py makemigrations && python manage.py migrate && python manage.py collectstatic --noinput && gunicorn core.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./core:/app
      - ./entrypoint.py:/entrypoint.py
      - static-volume:/app/staticfiles
      - media-volume:/app/media
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      - redis-to-do-app

  redis-to-do-app:
    container_name: redis-to-do-app
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning

  nginx-to-do-app:
    image: nginx
    container_name: nginx-to-do-app
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
      - static-volume:/home/app/staticfiles
      - media-volume:/home/app/media
    ports:
      - "80:80"
    depends_on:
      - redis-to-do-app
      - to-do-app-backend

  worker:
    build: .
    command: celery -A core worker --loglevel=info
    volumes:
      - ./core:/app
      - ./entrypoint.py:/entrypoint.py
    env_file:
      - .env
    depends_on:
      - redis-to-do-app
      - to-do-app-backend

  beater:
    build: .
    command: celery -A core beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./core:/app
      - ./entrypoint.py:/entrypoint.py
    env_file:
      - .env
    depends_on:
      - redis-to-do-app
      - to-do-app-backend

  db:
    image: postgres:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  static-volume:
  media-volume:
  postgres-data:
