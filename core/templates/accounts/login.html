{% extends 'base.html' %}
{% load static %}

{% block internalStyle %}
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* افکت دایره‌های تزئینی */
        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(108, 99, 255, 0.3);
            filter: blur(80px);
            z-index: 0;
        }
        body::before {
            width: 300px;
            height: 300px;
            top: -100px;
            left: -100px;
        }
        body::after {
            width: 400px;
            height: 400px;
            bottom: -150px;
            right: -150px;
            background: rgba(0, 210, 255, 0.2);
        }

        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        .login-card h2 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .login-card p.subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            font-size: 15px;
            color: #ffffff;
            transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
            outline: none;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .form-group input:focus {
            border-color: #6c63ff;
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
        }

        .form-options input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #6c63ff;
            cursor: pointer;
        }

        .form-options a {
            color: #00d2ff;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .form-options a:hover {
            color: #6c63ff;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6c63ff 0%, #00d2ff 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s, opacity 0.3s;
            box-shadow: 0 4px 15px rgba(108, 99, 255, 0.4);
        }

        .btn-login:hover {
            opacity: 0.95;
            box-shadow: 0 6px 20px rgba(108, 99, 255, 0.6);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .register-link a {
            color: #00d2ff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .register-link a:hover {
            color: #6c63ff;
        }

        /* ریسپانسیو */
        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px;
            }
        }
    </style>
{% endblock %}

{% block content %}
    <div class="login-card">
        <h2>ورود به حساب</h2>
        <p class="subtitle">به اپلیکیشن To-Do خوش آمدید</p>

        <form action="{% url 'accounts:login' %}" method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="email">نام کاربری یا ایمیل</label>
                <input type="email" id="username" name="username" placeholder="alireza@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">رمز عبور</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <div class="form-options">
                <label></label>
                <a href="#">فراموشی رمز؟</a>
            </div>
            <button type="submit" formaction="{% url 'accounts:login' %}" class="btn-login">ورود</button>
        </form>

        <div class="register-link">
            حساب کاربری ندارید؟ <a href="{% url 'accounts:signup' %}">ثبت‌نام کنید</a>
        </div>
    </div>
{% endblock %}
