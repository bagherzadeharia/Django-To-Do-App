{% extends 'base.html' %}
{% load static %}

{% block internalStyle %}
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* افکت دایره‌های تزئینی */
        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
        }
        body::before {
            width: 300px;
            height: 300px;
            top: -100px;
            left: -100px;
            background: rgba(108, 99, 255, 0.25);
        }
        body::after {
            width: 400px;
            height: 400px;
            bottom: -150px;
            right: -150px;
            background: rgba(0, 210, 255, 0.15);
        }

        .register-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 440px;
            padding: 40px 35px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .register-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        .register-card h2 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .register-card p.subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            font-size: 15px;
            color: #ffffff;
            transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
            outline: none;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .form-group input:focus {
            border-color: #6c63ff;
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        /* آیکون نمایش رمز */
        .toggle-password {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
            transition: color 0.3s;
            display: flex;
            align-items: center;
        }

        .toggle-password:hover {
            color: #00d2ff;
        }

        .form-group input[type="password"],
        .form-group input.password-with-icon {
            padding-left: 42px;
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6c63ff 0%, #00d2ff 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s, opacity 0.3s;
            box-shadow: 0 4px 15px rgba(108, 99, 255, 0.4);
            margin-top: 10px;
        }

        .btn-register:hover {
            opacity: 0.95;
            box-shadow: 0 6px 20px rgba(108, 99, 255, 0.6);
        }

        .btn-register:active {
            transform: scale(0.98);
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .login-link a {
            color: #00d2ff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .login-link a:hover {
            color: #6c63ff;
        }

        /* ریسپانسیو */
        @media (max-width: 480px) {
            .register-card {
                padding: 30px 20px;
            }
        }
    </style>
{% endblock %}

{% block content %}
    <div class="register-card">
        <h2>ساخت حساب کاربری</h2>
        <p class="subtitle">برای شروع، اطلاعات خود را وارد کنید</p>

        <form action="{% url 'accounts:signup' %}" method="POST" id="registerForm">
            {% csrf_token %}
            <div class="form-group">
                <label for="fullname">نام کامل</label>
                <input type="text" id="full_name" name="full_name" placeholder="مثلاً علی رضایی" required>
            </div>

            <div class="form-group">
                <label for="email">ایمیل</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">رمز عبور</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6">
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="نمایش رمز">
                        👁
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-register">ثبت‌نام</button>
        </form>

        <div class="login-link">
            قبلاً ثبت‌نام کرده‌اید؟ <a href="{% url 'accounts:login' %}">وارد شوید</a>
        </div>
    </div>

    <script>
        // نمایش/مخفی کردن رمز عبور
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            // تغییر آیکون
            this.textContent = type === 'password' ? '👁' : '🙈';
        });
    </script>
{% endblock %}
