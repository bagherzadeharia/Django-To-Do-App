<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ویرایش کار | To-Do</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* افکت دایره‌های تزئینی */
        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
        }
        body::before {
            width: 300px;
            height: 300px;
            top: -100px;
            left: -100px;
            background: rgba(108, 99, 255, 0.25);
        }
        body::after {
            width: 400px;
            height: 400px;
            bottom: -150px;
            right: -150px;
            background: rgba(0, 210, 255, 0.15);
        }

        .edit-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 480px;
            padding: 35px 30px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .edit-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        .edit-card h2 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 30px;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            font-size: 15px;
            color: #ffffff;
            transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
            outline: none;
        }

        .form-group input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .form-group input[type="text"]:focus {
            border-color: #6c63ff;
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #6c63ff;
            cursor: pointer;
        }

        .checkbox-group label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 15px;
            cursor: pointer;
            margin: 0;
        }

        .button-group {
            display: flex;
            gap: 12px;
        }

        .btn-save {
            flex: 1;
            padding: 14px;
            background: linear-gradient(135deg, #6c63ff 0%, #00d2ff 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s, opacity 0.3s;
            box-shadow: 0 4px 15px rgba(108, 99, 255, 0.4);
        }

        .btn-save:hover {
            opacity: 0.95;
            box-shadow: 0 6px 20px rgba(108, 99, 255, 0.6);
        }

        .btn-save:active {
            transform: scale(0.98);
        }

        .btn-cancel {
            padding: 14px 25px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s, border-color 0.3s;
            white-space: nowrap;
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* ریسپانسیو */
        @media (max-width: 480px) {
            .edit-card {
                padding: 25px 20px;
            }
            .button-group {
                flex-direction: column;
            }
            .btn-cancel {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="edit-card">
        <h2>ویرایش کار</h2>
        <form action="{% url 'todo:edit' pk=task.id %}" method="post" id="editForm">
            {% csrf_token %}
            <div class="form-group">
                <label for="taskTitle">عنوان کار</label>
                <input type="text" id="taskTitle" name="title" value="{{ task.title }}" required>
            </div>
            <div class="button-group">
                <button type="submit" class="btn-save">ذخیره تغییرات</button>
                <a href="{% url 'todo:list' %}" class="btn-cancel">انصراف</a>
            </div>
        </form>
    </div>
</body>
</html>
